<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="井字棋 thumbnail">
  <defs>
    <!-- Pixel grid pattern: 1px dots every 16x16 cells -->
    <pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#162040" opacity="0.6"/>
      <rect x="8" y="0" width="1" height="1" fill="#162040" opacity="0.3"/>
      <rect x="0" y="8" width="1" height="1" fill="#162040" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Dark background -->
  <rect width="640" height="360" fill="#0f0f23"/>
  <rect width="640" height="360" fill="url(#pixelGrid)"/>

  <!-- Text label background -->
  <rect x="265" y="36" width="110" height="32" rx="4" fill="#1e2749" stroke="#4a4a8a" stroke-width="2"/>
  <text x="320" y="58" text-anchor="middle" font-family="'Press Start 2P', 'Microsoft JhengHei', monospace" font-size="14" fill="#e0e0ff">井字棋</text>

  <!-- Game board area -->
  <rect x="197" y="97" width="246" height="246" rx="4" fill="#1a1a3e"/>

  <!-- Grid lines (horizontal) -->
  <rect x="197" y="165" width="246" height="14" fill="#2a2a5a"/>
  <rect x="197" y="239" width="246" height="14" fill="#2a2a5a"/>

  <!-- Grid lines (vertical) -->
  <rect x="265" y="97" width="14" height="246" fill="#2a2a5a"/>
  <rect x="361" y="97" width="14" height="246" fill="#2a2a5a"/>

  <!-- ╳ pixel art X mark - top left cell -->
  <g fill="#00ff88">
    <!-- Diagonal 1 (top-left to bottom-right) -->
    <rect x="213" y="113" width="6" height="6"/>
    <rect x="219" y="119" width="6" height="6"/>
    <rect x="225" y="125" width="6" height="6"/>
    <rect x="231" y="131" width="6" height="6"/>
    <rect x="237" y="137" width="6" height="6"/>
    <rect x="243" y="143" width="6" height="6"/>
    <rect x="249" y="149" width="6" height="6"/>
    <rect x="255" y="155" width="6" height="6"/>
    <!-- Diagonal 2 (top-right to bottom-left) -->
    <rect x="219" y="113" width="6" height="6"/>
    <rect x="225" y="119" width="6" height="6"/>
    <rect x="231" y="125" width="6" height="6"/>
    <rect x="237" y="131" width="6" height="6"/>
    <rect x="243" y="137" width="6" height="6"/>
    <rect x="249" y="143" width="6" height="6"/>
    <rect x="255" y="149" width="6" height="6"/>
    <rect x="261" y="155" width="6" height="6"/>
  </g>

  <!-- ╳ pixel art X mark - bottom right cell -->
  <g fill="#00ff88">
    <!-- Diagonal 1 -->
    <rect x="361" y="261" width="6" height="6"/>
    <rect x="367" y="267" width="6" height="6"/>
    <rect x="373" y="273" width="6" height="6"/>
    <rect x="379" y="279" width="6" height="6"/>
    <rect x="385" y="285" width="6" height="6"/>
    <rect x="391" y="291" width="6" height="6"/>
    <rect x="397" y="297" width="6" height="6"/>
    <rect x="403" y="303" width="6" height="6"/>
    <!-- Diagonal 2 -->
    <rect x="367" y="261" width="6" height="6"/>
    <rect x="373" y="267" width="6" height="6"/>
    <rect x="379" y="273" width="6" height="6"/>
    <rect x="385" y="279" width="6" height="6"/>
    <rect x="391" y="285" width="6" height="6"/>
    <rect x="397" y="291" width="6" height="6"/>
    <rect x="403" y="297" width="6" height="6"/>
    <rect x="409" y="303" width="6" height="6"/>
  </g>

  <!-- Ｏ pixel art O mark - center cell -->
  <g fill="#00d4ff">
    <!-- Top & bottom border -->
    <rect x="275" y="187" width="50" height="12"/>
    <rect x="275" y="245" width="50" height="12"/>
    <!-- Left & right border -->
    <rect x="275" y="187" width="12" height="70"/>
    <rect x="315" y="187" width="12" height="70"/>
    <!-- Inner fill to avoid double-stroke -->
    <rect x="303" y="187" width="24" height="12"/>
    <rect x="303" y="245" width="24" height="12"/>
  </g>

  <!-- Ｏ pixel art O mark - bottom right cell -->
  <g fill="#00d4ff">
    <!-- Top & bottom border -->
    <rect x="380" y="276" width="50" height="12"/>
    <rect x="380" y="334" width="50" height="12"/>
    <!-- Left & right border -->
    <rect x="380" y="276" width="12" height="70"/>
    <rect x="420" y="276" width="12" height="70"/>
    <!-- Inner fill -->
    <rect x="408" y="276" width="24" height="12"/>
    <rect x="408" y="334" width="24" height="12"/>
  </g>

  <!-- Winning diagonal line (yellow, thick stroke effect via overlapping rects) -->
  <g fill="#ffff00" opacity="0.9">
    <rect x="240" y="153" width="140" height="10" transform="rotate(45, 310, 158)"/>
  </g>

  <!-- Pixel victory stars - top left corner -->
  <g>
    <rect x="32" y="28" width="8" height="8" fill="#ffcc00"/>
    <rect x="24" y="36" width="8" height="8" fill="#ffcc00"/>
    <rect x="40" y="36" width="8" height="8" fill="#ffaa00"/>
    <rect x="16" y="44" width="8" height="8" fill="#ffaa00"/>
    <rect x="48" y="44" width="8" height="8" fill="#ffcc00"/>
    <rect x="24" y="52" width="8" height="8" fill="#ff8800"/>
    <rect x="40" y="52" width="8" height="8" fill="#ff8800"/>
  </g>

  <!-- Pixel victory stars - top right corner -->
  <g>
    <rect x="592" y="28" width="8" height="8" fill="#ffcc00"/>
    <rect x="584" y="36" width="8" height="8" fill="#ffcc00"/>
    <rect x="600" y="36" width="8" height="8" fill="#ffaa00"/>
    <rect x="576" y="44" width="8" height="8" fill="#ffaa00"/>
    <rect x="608" y="44" width="8" height="8" fill="#ffcc00"/>
    <rect x="584" y="52" width="8" height="8" fill="#ff8800"/>
    <rect x="600" y="52" width="8" height="8" fill="#ff8800"/>
  </g>

  <!-- Pixel victory stars - bottom left corner -->
  <g>
    <rect x="32" y="300" width="8" height="8" fill="#ffcc00"/>
    <rect x="24" y="308" width="8" height="8" fill="#ffcc00"/>
    <rect x="40" y="308" width="8" height="8" fill="#ffaa00"/>
    <rect x="16" y="316" width="8" height="8" fill="#ffaa00"/>
    <rect x="48" y="316" width="8" height="8" fill="#ffcc00"/>
    <rect x="24" y="324" width="8" height="8" fill="#ff8800"/>
    <rect x="40" y="324" width="8" height="8" fill="#ff8800"/>
  </g>

  <!-- Pixel victory stars - bottom right corner -->
  <g>
    <rect x="592" y="300" width="8" height="8" fill="#ffcc00"/>
    <rect x="584" y="308" width="8" height="8" fill="#ffcc00"/>
    <rect x="600" y="308" width="8" height="8" fill="#ffaa00"/>
    <rect x="576" y="316" width="8" height="8" fill="#ffaa00"/>
    <rect x="608" y="316" width="8" height="8" fill="#ffcc00"/>
    <rect x="584" y="324" width="8" height="8" fill="#ff8800"/>
    <rect x="600" y="324" width="8" height="8" fill="#ff8800"/>
  </g>

  <!-- Corner dot accents -->
  <g fill="#4a4a8a" opacity="0.5">
    <rect x="16" y="16" width="4" height="4"/>
    <rect x="620" y="16" width="4" height="4"/>
    <rect x="16" y="340" width="4" height="4"/>
    <rect x="620" y="340" width="4" height="4"/>
  </g>
</svg>
