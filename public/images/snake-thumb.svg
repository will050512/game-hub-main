<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="貪吃蛇 thumbnail">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
  </style>

  <!-- Dark background -->
  <rect width="640" height="360" fill="#0f0f23"/>

  <!-- Retro grid lines (40px pixel grid) -->
  <g stroke="#1a2a3a" stroke-width="1">
    <line x1="0" y1="40" x2="640" y2="40"/>
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="200" x2="640" y2="200"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="280" x2="640" y2="280"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="40" y1="40" x2="40" y2="360"/>
    <line x1="80" y1="40" x2="80" y2="360"/>
    <line x1="120" y1="40" x2="120" y2="360"/>
    <line x1="160" y1="40" x2="160" y2="360"/>
    <line x1="200" y1="40" x2="200" y2="360"/>
    <line x1="240" y1="40" x2="240" y2="360"/>
    <line x1="280" y1="40" x2="280" y2="360"/>
    <line x1="320" y1="40" x2="320" y2="360"/>
    <line x1="360" y1="40" x2="360" y2="360"/>
    <line x1="400" y1="40" x2="400" y2="360"/>
    <line x1="440" y1="40" x2="440" y2="360"/>
    <line x1="480" y1="40" x2="480" y2="360"/>
    <line x1="520" y1="40" x2="520" y2="360"/>
    <line x1="560" y1="40" x2="560" y2="360"/>
    <line x1="600" y1="40" x2="600" y2="360"/>
  </g>

  <!-- Title bar -->
  <rect x="0" y="0" width="640" height="40" fill="#0a0a1a" fill-opacity="0.85"/>
  <line x1="0" y1="40" x2="640" y2="40" stroke="#4a4a8a" stroke-width="2"/>

  <!-- Title text -->
  <text x="320" y="30" font-family="'Press Start 2P', monospace" font-size="20" fill="#e0e0ff" text-anchor="middle" letter-spacing="6">貪 吃 蛇</text>

  <!-- Score display -->
  <rect x="554" y="14" width="68" height="20" rx="2" fill="#1a2a3a"/>
  <text x="562" y="28" font-family="'Press Start 2P', monospace" font-size="10" fill="#66ffaa">0</text>

  <!-- Corner pixel decorations -->
  <g fill="#2a4a3a">
    <rect x="8" y="8" width="12" height="12"/>
    <rect x="24" y="8" width="8" height="8"/>
    <rect x="8" y="24" width="8" height="8"/>
  </g>
  <g fill="#2a4a3a">
    <rect x="620" y="8" width="12" height="12"/>
    <rect x="608" y="8" width="8" height="8"/>
    <rect x="620" y="24" width="8" height="8"/>
  </g>

  <!-- ========== SNAKE BODY ========== -->
  <!-- Dark border base (16px pixel blocks) -->
  <g fill="#2a6a4a">
    <!-- Head row (y=128-144) -->
    <rect x="272" y="128" width="16" height="16"/>
    <!-- Body row 1 (y=160) -->
    <rect x="224" y="160" width="16" height="16"/>
    <rect x="240" y="160" width="16" height="16"/>
    <rect x="256" y="160" width="16" height="16"/>
    <rect x="272" y="160" width="16" height="16"/>
    <rect x="288" y="160" width="16" height="16"/>
    <!-- Body row 2 (y=176) - descending -->
    <rect x="224" y="176" width="16" height="16"/>
    <!-- Body row 3 (y=192) - descending more -->
    <rect x="224" y="192" width="16" height="16"/>
    <!-- Body row 4 (y=208) - long horizontal -->
    <rect x="224" y="208" width="16" height="16"/>
    <rect x="240" y="208" width="16" height="16"/>
    <rect x="256" y="208" width="16" height="16"/>
    <rect x="272" y="208" width="16" height="16"/>
    <rect x="288" y="208" width="16" height="16"/>
    <rect x="304" y="208" width="16" height="16"/>
    <rect x="320" y="208" width="16" height="16"/>
    <!-- Body row 5 (y=224) - descending -->
    <rect x="320" y="224" width="16" height="16"/>
    <!-- Body row 6 (y=240) - descending more -->
    <rect x="320" y="240" width="16" height="16"/>
    <!-- Body row 7 (y=256) - long horizontal tail -->
    <rect x="224" y="256" width="16" height="16"/>
    <rect x="240" y="256" width="16" height="16"/>
    <rect x="256" y="256" width="16" height="16"/>
    <rect x="272" y="256" width="16" height="16"/>
    <rect x="288" y="256" width="16" height="16"/>
    <rect x="304" y="256" width="16" height="16"/>
  </g>

  <!-- Light green inner highlights (offset by 2px for 3D pixel effect) -->
  <g fill="#44ff88">
    <rect x="274" y="130" width="12" height="12"/>
    <rect x="226" y="162" width="12" height="12"/>
    <rect x="242" y="162" width="12" height="12"/>
    <rect x="258" y="162" width="12" height="12"/>
    <rect x="274" y="162" width="12" height="12"/>
    <rect x="290" y="162" width="12" height="12"/>
    <rect x="226" y="178" width="12" height="12"/>
    <rect x="226" y="194" width="12" height="12"/>
    <rect x="226" y="210" width="12" height="12"/>
    <rect x="242" y="210" width="12" height="12"/>
    <rect x="258" y="210" width="12" height="12"/>
    <rect x="274" y="210" width="12" height="12"/>
    <rect x="290" y="210" width="12" height="12"/>
    <rect x="306" y="210" width="12" height="12"/>
    <rect x="322" y="210" width="12" height="12"/>
    <rect x="322" y="226" width="12" height="12"/>
    <rect x="322" y="242" width="12" height="12"/>
    <rect x="226" y="258" width="12" height="12"/>
    <rect x="242" y="258" width="12" height="12"/>
    <rect x="258" y="258" width="12" height="12"/>
    <rect x="274" y="258" width="12" height="12"/>
    <rect x="290" y="258" width="12" height="12"/>
    <rect x="306" y="258" width="12" height="12"/>
  </g>

  <!-- ========== SNAKE HEAD ========== -->
  <!-- Dark border -->
  <rect x="288" y="112" width="16" height="16" fill="#2a6a4a"/>
  <rect x="288" y="128" width="16" height="16" fill="#2a6a4a"/>
  <rect x="304" y="112" width="16" height="16" fill="#2a6a4a"/>
  <rect x="304" y="128" width="16" height="16" fill="#2a6a4a"/>

  <!-- Light green inner -->
  <rect x="290" y="114" width="12" height="12" fill="#44ff88"/>
  <rect x="290" y="130" width="12" height="12" fill="#44ff88"/>
  <rect x="306" y="114" width="12" height="12" fill="#44ff88"/>
  <rect x="306" y="130" width="12" height="12" fill="#44ff88"/>

  <!-- Left eye -->
  <rect x="292" y="116" width="6" height="6" fill="#e0e0ff"/>
  <rect x="294" y="118" width="4" height="4" fill="#1a1a2e"/>

  <!-- Right eye -->
  <rect x="304" y="116" width="6" height="6" fill="#e0e0ff"/>
  <rect x="306" y="118" width="4" height="4" fill="#1a1a2e"/>

  <!-- Tongue (forked) -->
  <rect x="320" y="116" width="8" height="4" fill="#ff4444"/>
  <rect x="328" y="112" width="4" height="4" fill="#ff4444"/>
  <rect x="328" y="124" width="4" height="4" fill="#ff4444"/>

  <!-- ========== APPLE ========== -->
  <!-- Dark base -->
  <rect x="528" y="160" width="32" height="32" fill="#cc2222"/>
  <!-- Bright inner -->
  <rect x="532" y="164" width="24" height="24" fill="#ff4444"/>
  <!-- Highlight -->
  <rect x="534" y="166" width="4" height="4" fill="#ff8888"/>
  <!-- Leaf stem -->
  <rect x="552" y="148" width="4" height="12" fill="#44aa22"/>
  <!-- Leaf blade -->
  <rect x="548" y="144" width="8" height="6" fill="#44aa22"/>
  <rect x="552" y="140" width="8" height="6" fill="#44aa22"/>

  <!-- Bottom pixel decorations -->
  <g fill="#1a3a2a">
    <rect x="8" y="348" width="8" height="8"/>
    <rect x="20" y="348" width="8" height="8"/>
    <rect x="8" y="358" width="8" height="8"/>
    <rect x="620" y="348" width="8" height="8"/>
    <rect x="608" y="348" width="8" height="8"/>
    <rect x="620" y="358" width="8" height="8"/>
  </g>
</svg>