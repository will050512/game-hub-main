<!-- Game Hub: 數獨 (Sudoku) — Optimized Thumbnail (~8KB) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="數獨 thumbnail">
  <defs>
    <pattern id="pixelGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#12122a"/>
      <rect width="1" height="1" fill="#1a1a40" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" rx="4" fill="#0f0f23"/>
  <rect width="640" height="360" rx="4" fill="url(#pixelGrid)"/>

  <!-- ===== SUDOKU GRID (using lines for grid lines) ===== -->
  <g transform="translate(164, 45)">
    <!-- Cell backgrounds -->
    <rect width="312" height="312" rx="2" fill="#1a1a38"/>
    <rect x="3" y="3" width="306" height="306" fill="#222244" rx="2"/>

    <!-- Thin cell borders (replaced rects with lines) -->
    <g stroke="#2a2a5a" stroke-width="1">
      <line x1="38" y1="3" x2="38" y2="309"/><line x1="76" y1="3" x2="76" y2="309"/>
      <line x1="114" y1="3" x2="114" y2="309"/><line x1="152" y1="3" x2="152" y2="309"/>
      <line x1="190" y1="3" x2="190" y2="309"/><line x1="228" y1="3" x2="228" y2="309"/>
      <line x1="266" y1="3" x2="266" y2="309"/><line x1="304" y1="3" x2="304" y2="309"/>
      <line x1="3" y1="38" x2="309" y2="38"/><line x1="3" y1="76" x2="309" y2="76"/>
      <line x1="3" y1="114" x2="309" y2="114"/><line x1="3" y1="152" x2="309" y2="152"/>
      <line x1="3" y1="190" x2="309" y2="190"/><line x1="3" y1="228" x2="309" y2="228"/>
      <line x1="3" y1="266" x2="309" y2="266"/><line x1="3" y1="304" x2="309" y2="304"/>
    </g>

    <!-- Thick box borders (replaced rects with lines) -->
    <g stroke="#4a4a8a" stroke-width="3">
      <line x1="113" y1="2" x2="113" y2="310"/>
      <line x1="230" y1="2" x2="230" y2="310"/>
      <line x1="2" y1="113" x2="310" y2="113"/>
      <line x1="2" y1="230" x2="310" y2="230"/>
      <rect x="1" y="1" width="310" height="310" fill="none" rx="2"/>
    </g>

    <!-- ===== NUMBERS (replaced pixel rects with <text> elements) ===== -->
    <g font-family="'Courier New', monospace" font-size="22" fill="#e0e0ff" text-anchor="middle" dominant-baseline="central">
      <!-- Row 0 -->
      <text x="24" y="24">1</text>
      <text x="160" y="24">2</text>
      <text x="236" y="24">7</text>
      <!-- Row 1 -->
      <text x="132" y="60">8</text>
      <text x="280" y="60">5</text>
      <!-- Row 2 -->
      <text x="72" y="96">3</text>
      <text x="200" y="96">4</text>
      <!-- Row 3 -->
      <text x="108" y="132">8</text>
      <text x="260" y="132">2</text>
      <!-- Row 4 (center - highlighted) -->
      <text x="170" y="168">6</text>
      <!-- Row 5 -->
      <text x="24" y="204">9</text>
      <text x="236" y="204">3</text>
      <!-- Row 6 -->
      <text x="132" y="240">7</text>
      <text x="284" y="240">9</text>
      <!-- Row 7 -->
      <text x="72" y="276">6</text>
      <text x="200" y="276">5</text>
      <!-- Row 8 -->
      <text x="106" y="312">1</text>
      <text x="162" y="312">9</text>
      <text x="276" y="312">4</text>
    </g>

    <!-- Highlight: center cell (yellow) -->
    <rect x="161" y="148" width="42" height="37" fill="#ffff00" opacity="0.15" rx="2"/>

    <!-- Green user input highlight (cell 4,7) -->
    <rect x="274" y="228" width="44" height="39" fill="#00ff88" opacity="0.12" rx="2"/>
    <!-- Green input number -->
    <text x="296" y="249" font-family="'Courier New', monospace" font-size="22" fill="#00ff88" text-anchor="middle" dominant-baseline="central">4</text>

    <!-- Grid corner decorations -->
    <rect x="1" y="1" width="6" height="2" fill="#4a4a8a"/>
    <rect x="1" y="1" width="2" height="6" fill="#4a4a8a"/>
    <rect x="309" y="1" width="6" height="2" fill="#4a4a8a"/>
    <rect x="309" y="1" width="2" height="6" fill="#4a4a8a"/>
    <rect x="1" y="307" width="6" height="2" fill="#4a4a8a"/>
    <rect x="1" y="307" width="2" height="6" fill="#4a4a8a"/>
    <rect x="309" y="307" width="6" height="2" fill="#4a4a8a"/>
    <rect x="309" y="307" width="2" height="6" fill="#4a4a8a"/>
  </g>

  <!-- ===== LOGIC BADGE (replaced pixel art with text) ===== -->
  <g transform="translate(490, 14)">
    <rect width="134" height="36" rx="4" fill="#1e2749"/>
    <rect width="134" height="36" rx="2" fill="none" stroke="#4a4a8a" stroke-width="2"/>
    <rect x="2" y="2" width="130" height="32" rx="2" fill="none" stroke="#2a4a7a" stroke-width="1"/>
    <!-- LOGIC as text (replaced pixel art) -->
    <text x="67" y="24" font-family="'Courier New', monospace" font-size="18" text-anchor="middle">
      <tspan fill="#00ff88">L</tspan><tspan fill="#ff6b6b">O</tspan><tspan fill="#ffaa00">G</tspan><tspan fill="#e0e0ff">I</tspan><tspan fill="#6b9fff">C</tspan>
    </text>
  </g>

  <!-- Title label -->
  <g transform="translate(16, 300)">
    <rect width="195" height="48" rx="4" fill="#1e2749"/>
    <rect width="195" height="48" rx="2" fill="none" stroke="#4a4a8a" stroke-width="2"/>
    <rect x="2" y="2" width="191" height="44" rx="2" fill="none" stroke="#2a4a7a" stroke-width="1"/>
    <text x="97" y="30" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" fill="#e0e0ff" font-weight="bold">數獨</text>
  </g>

  <!-- Corner decorations -->
  <g fill="#4a4a8a" opacity="0.6">
    <rect x="8" y="12" width="12" height="4"/><rect x="8" y="12" width="4" height="12"/>
    <rect x="620" y="12" width="12" height="4"/><rect x="620" y="12" width="4" height="12"/>
    <rect x="8" y="344" width="12" height="4"/><rect x="8" y="344" width="4" height="12"/>
    <rect x="620" y="344" width="12" height="4"/><rect x="620" y="344" width="4" height="12"/>
  </g>
</svg>
