<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Green Frog Mascot - Kawaii Style -->
  <defs>
    <clipPath id="frog-clip">
      <rect width="128" height="128"/>
    </clipPath>
  </defs>
  
  <!-- Body -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#6ee7b7">
    <!-- Main body -->
    <ellipse cx="64" cy="82" rx="30" ry="28"/>
    <!-- Head -->
    <circle cx="64" cy="48" r="32"/>
    <!-- Left eye bump -->
    <circle cx="46" cy="28" r="14"/>
    <!-- Right eye bump -->
    <circle cx="82" cy="28" r="14"/>
  </g>
  
  <!-- Inner eye circles - lighter green -->
  <g fill="#a7f3d0" stroke="none">
    <circle cx="46" cy="28" r="10"/>
    <circle cx="82" cy="28" r="10"/>
  </g>
  
  <!-- Eye spirals - black (dizzy expression) -->
  <g fill="none" stroke="#1a1a1a" stroke-width="3">
    <!-- Left spiral -->
    <path d="M46 28 m-5 0 a 5 5 0 1 0 10 0 a 5 5 0 1 0 -10 0"/>
    <path d="M46 28 m-2 0 a 2 2 0 1 0 4 0 a 2 2 0 1 0 -4 0"/>
    <!-- Right spiral -->
    <path d="M82 28 m-5 0 a 5 5 0 1 0 10 0 a 5 5 0 1 0 -10 0"/>
    <path d="M82 28 m-2 0 a 2 2 0 1 0 4 0 a 2 2 0 1 0 -4 0"/>
  </g>
  
  <!-- Central eye spot -->
  <circle cx="64" cy="52" r="3" fill="#1a1a1a"/>
  
  <!-- Mouth - wide O shape -->
  <g fill="none" stroke="#1a1a1a" stroke-width="4">
    <ellipse cx="64" cy="64" rx="12" ry="10"/>
  </g>
  
  <!-- Tongue - red inside -->
  <ellipse cx="64" cy="68" rx="6" ry="4" fill="#f87171" stroke="none"/>
  
  <!-- Teeth - white -->
  <g fill="#ffffff" stroke="none">
    <rect x="58" y="60" width="3" height="4" rx="1"/>
    <rect x="67" y="60" width="3" height="4" rx="1"/>
  </g>
  
  <!-- Arms -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#6ee7b7">
    <ellipse cx="30" cy="72" rx="10" ry="14"/>
    <ellipse cx="98" cy="72" rx="10" ry="14"/>
  </g>
  
  <!-- Feet -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#6ee7b7">
    <ellipse cx="44" cy="108" rx="12" ry="8"/>
    <ellipse cx="84" cy="108" rx="12" ry="8"/>
  </g>
  
  <!-- Belly - lighter green -->
  <ellipse cx="64" cy="80" rx="18" ry="16" fill="#a7f3d0" stroke="none"/>
</svg>