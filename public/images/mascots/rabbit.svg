<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Pink Rabbit Mascot - Kawaii Style -->
  <defs>
    <clipPath id="rabbit-clip">
      <rect width="128" height="128"/>
    </clipPath>
  </defs>
  
  <!-- Body -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#f9a8d4">
    <!-- Main body -->
    <ellipse cx="64" cy="78" rx="28" ry="32"/>
    <!-- Head -->
    <circle cx="64" cy="48" r="32"/>
    <!-- Left ear -->
    <ellipse cx="48" cy="18" rx="10" ry="24"/>
    <!-- Right ear -->
    <ellipse cx="80" cy="18" rx="10" ry="24"/>
  </g>
  
  <!-- Inner ears - lighter pink -->
  <g fill="#fbcfe8" stroke="none">
    <ellipse cx="48" cy="18" rx="6" ry="18"/>
    <ellipse cx="80" cy="18" rx="6" ry="18"/>
  </g>
  
  <!-- Eyes -->
  <g fill="#1a1a1a">
    <circle cx="52" cy="44" r="8"/>
    <circle cx="76" cy="44" r="8"/>
  </g>
  
  <!-- Eye highlights -->
  <g fill="#ffffff">
    <circle cx="54" cy="42" r="3"/>
    <circle cx="78" cy="42" r="3"/>
  </g>
  
  <!-- Blush -->
  <g fill="#f9a8d4" opacity="0.6">
    <ellipse cx="42" cy="56" rx="6" ry="4"/>
    <ellipse cx="86" cy="56" rx="6" ry="4"/>
  </g>
  
  <!-- Nose -->
  <ellipse cx="64" cy="54" rx="4" ry="3" fill="#1a1a1a"/>
  
  <!-- Mouth - "w" shape -->
  <path d="M58 60 Q64 66 70 60" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Arms -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#f9a8d4">
    <ellipse cx="38" cy="72" rx="8" ry="12"/>
    <ellipse cx="90" cy="72" rx="8" ry="12"/>
  </g>
  
  <!-- Feet -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#f9a8d4">
    <ellipse cx="50" cy="108" rx="12" ry="8"/>
    <ellipse cx="78" cy="108" rx="12" ry="8"/>
  </g>
</svg>