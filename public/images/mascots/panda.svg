<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Panda Mascot - Kawaii Style -->
  <defs>
    <clipPath id="panda-clip">
      <rect width="128" height="128"/>
    </clipPath>
  </defs>
  
  <!-- Body - Black -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#1a1a1a">
    <!-- Main body -->
    <ellipse cx="64" cy="80" rx="28" ry="30"/>
    <!-- Head -->
    <circle cx="64" cy="48" r="34"/>
    <!-- Left ear -->
    <circle cx="38" cy="24" r="12"/>
    <!-- Right ear -->
    <circle cx="90" cy="24" r="12"/>
  </g>
  
  <!-- Inner ears - white/grey -->
  <g fill="#4a4a4a" stroke="none">
    <circle cx="38" cy="24" r="8"/>
    <circle cx="90" cy="24" r="8"/>
  </g>
  
  <!-- Eye patches - white -->
  <g fill="#ffffff" stroke="none">
    <ellipse cx="48" cy="44" rx="14" ry="12"/>
    <ellipse cx="80" cy="44" rx="14" ry="12"/>
  </g>
  
  <!-- Eyes - black -->
  <g fill="#1a1a1a">
    <circle cx="50" cy="46" r="6"/>
    <circle cx="78" cy="46" r="6"/>
  </g>
  
  <!-- Eye highlights -->
  <g fill="#ffffff">
    <circle cx="52" cy="44" r="2.5"/>
    <circle cx="80" cy="44" r="2.5"/>
  </g>
  
  <!-- Nose -->
  <ellipse cx="64" cy="56" rx="6" ry="4" fill="#1a1a1a"/>
  
  <!-- Mouth -->
  <path d="M58 62 Q64 68 70 62" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Blush - pink -->
  <g fill="#f9a8d4" opacity="0.5">
    <ellipse cx="38" cy="58" rx="8" ry="5"/>
    <ellipse cx="90" cy="58" rx="8" ry="5"/>
  </g>
  
  <!-- Arms -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#1a1a1a">
    <ellipse cx="34" cy="74" rx="10" ry="16"/>
    <ellipse cx="94" cy="74" rx="10" ry="16"/>
  </g>
  
  <!-- Feet -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#1a1a1a">
    <ellipse cx="48" cy="108" rx="14" ry="10"/>
    <ellipse cx="80" cy="108" rx="14" ry="10"/>
  </g>
  
  <!-- Belly - white -->
  <ellipse cx="64" cy="78" rx="18" ry="20" fill="#ffffff" stroke="none"/>
</svg>