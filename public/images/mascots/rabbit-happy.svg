<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Pink Rabbit - Happy Expression -->
  <defs>
    <clipPath id="rabbit-clip">
      <rect width="128" height="128"/>
    </clipPath>
  </defs>
  
  <!-- Body -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#f9a8d4">
    <!-- Main body -->
    <ellipse cx="64" cy="78" rx="28" ry="32"/>
    <!-- Head -->
    <circle cx="64" cy="48" r="32"/>
    <!-- Left ear -->
    <ellipse cx="48" cy="18" rx="10" ry="24"/>
    <!-- Right ear -->
    <ellipse cx="80" cy="18" rx="10" ry="24"/>
  </g>
  
  <!-- Inner ears - lighter pink -->
  <g fill="#fbcfe8" stroke="none">
    <ellipse cx="48" cy="18" rx="6" ry="18"/>
    <ellipse cx="80" cy="18" rx="6" ry="18"/>
  </g>
  
  <!-- Eyes - HAPPY (arched) -->
  <g fill="#1a1a1a">
    <path d="M44 42 Q52 36 60 42" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <path d="M68 42 Q76 36 84 42" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Eye highlights -->
  <g fill="#ffffff">
    <circle cx="50" cy="44" r="3"/>
    <circle cx="78" cy="44" r="3"/>
  </g>
  
  <!-- Blush -->
  <g fill="#f9a8d4" opacity="0.6">
    <ellipse cx="40" cy="54" rx="8" ry="5"/>
    <ellipse cx="88" cy="54" rx="8" ry="5"/>
  </g>
  
  <!-- Nose -->
  <ellipse cx="64" cy="52" rx="4" ry="3" fill="#1a1a1a"/>
  
  <!-- Mouth - BIG HAPPY SMILE -->
  <path d="M52 56 Q64 72 76 56" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Arms - waving -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#f9a8d4">
    <ellipse cx="32" cy="68" rx="10" ry="14"/>
    <ellipse cx="96" cy="68" rx="10" ry="14"/>
  </g>
  
  <!-- Feet -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#f9a8d4">
    <ellipse cx="50" cy="108" rx="12" ry="8"/>
    <ellipse cx="78" cy="108" rx="12" ry="8"/>
  </g>
</svg>