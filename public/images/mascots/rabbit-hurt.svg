<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Pink Rabbit - Hurt/Sad Expression -->
  <defs>
    <clipPath id="rabbit-clip">
      <rect width="128" height="128"/>
    </clipPath>
  </defs>
  
  <!-- Body -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#f9a8d4">
    <ellipse cx="64" cy="78" rx="28" ry="32"/>
    <circle cx="64" cy="48" r="32"/>
    <ellipse cx="48" cy="18" rx="10" ry="24"/>
    <ellipse cx="80" cy="18" rx="10" ry="24"/>
  </g>
  
  <!-- Inner ears - droopy -->
  <g fill="#fbcfe8" stroke="none">
    <ellipse cx="46" cy="24" rx="6" ry="16"/>
    <ellipse cx="82" cy="24" rx="6" ry="16"/>
  </g>
  
  <!-- Eyes - SAD (angled down) -->
  <g fill="#1a1a1a">
    <path d="M44 42 L60 48" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <path d="M68 48 L84 42" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Teardrop -->
  <g fill="#60a5fa" stroke="none">
    <path d="M86 48 Q90 56 86 64 Q82 56 86 48" opacity="0.8"/>
  </g>
  
  <!-- Blush - less prominent -->
  <g fill="#f9a8d4" opacity="0.4">
    <ellipse cx="40" cy="56" rx="6" ry="4"/>
    <ellipse cx="88" cy="56" rx="6" ry="4"/>
  </g>
  
  <!-- Nose -->
  <ellipse cx="64" cy="52" rx="4" ry="3" fill="#1a1a1a"/>
  
  <!-- Mouth - frown -->
  <path d="M54 64 Q64 58 74 64" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Arms - weak -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#f9a8d4">
    <ellipse cx="40" cy="72" rx="8" ry="12"/>
    <ellipse cx="88" cy="72" rx="8" ry="12"/>
  </g>
  
  <!-- Feet -->
  <g stroke="#1a1a1a" stroke-width="4" fill="#f9a8d4">
    <ellipse cx="50" cy="108" rx="12" ry="8"/>
    <ellipse cx="78" cy="108" rx="12" ry="8"/>
  </g>
</svg>