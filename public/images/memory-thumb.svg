    <rect x="320" y="195" width="80" height="100" rx="4" fill="#1e2749" stroke="#4a4a8a" stroke-width="2"/>
    <!-- Inner background -->
    <rect x="324" y="199" width="72" height="92" rx="2" fill="#151d38"/>
