  <rect x="265" y="60" width="110" height="160" rx="4" fill="#00ff88" opacity="0.07"/>
  <rect x="275" y="70" width="90" height="140" rx="4" fill="#00ff88" opacity="0.10"/>
  <rect x="295" y="165" width="130" height="180" rx="4" fill="#00ff88" opacity="0.04"/>
  <rect x="305" y="175" width="110" height="160" rx="4" fill="#00ff88" opacity="0.07"/>
  <rect x="315" y="185" width="90" height="140" rx="4" fill="#00ff88" opacity="0.10"/>
