    <rect x="16" y="10" width="4" height="4"/>
    <rect x="10" y="16" width="4" height="4"/>
    <rect x="620" y="10" width="4" height="4"/>
    <rect x="614" y="10" width="4" height="4"/>
    <rect x="620" y="16" width="4" height="4"/>
    <rect x="10" y="340" width="4" height="4"/>
    <rect x="10" y="334" width="4" height="4"/>
    <rect x="16" y="340" width="4" height="4"/>
    <rect x="620" y="340" width="4" height="4"/>
    <rect x="620" y="334" width="4" height="4"/>
    <rect x="614" y="340" width="4" height="4"/>
