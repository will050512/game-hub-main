    <!-- Inner frame -->
    <rect x="453" y="213" width="64" height="84" rx="3" fill="none" stroke="#2a2a5a" stroke-width="1"/>
    <!-- Small center diamond -->
    <rect x="475" y="245" width="12" height="12" fill="#2a2a5a" transform="rotate(45,481,251)"/>
    <!-- Corner dots -->
    <rect x="457" y="213" width="4" height="4" fill="#333366" opacity="0.4"/>
    <rect x="499" y="213" width="4" height="4" fill="#333366" opacity="0.4"/>
    <rect x="457" y="277" width="4" height="4" fill="#333366" opacity="0.4"/>
    <rect x="499" y="277" width="4" height="4" fill="#333366" opacity="0.4"/>
