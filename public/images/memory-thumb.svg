  <rect x="250" y="95" width="4" height="4" fill="#ffd700" opacity="0.5"/>
  <rect x="275" y="42" width="4" height="4" fill="#00ff88" opacity="0.4"/>
  <rect x="290" y="48" width="6" height="6" fill="#ffffff" opacity="0.7"/>
  <rect x="310" y="38" width="4" height="4" fill="#ffd700" opacity="0.6"/>
  <rect x="330" y="60" width="6" height="6" fill="#ffffff" opacity="0.5"/>
  <rect x="350" y="48" width="4" height="4" fill="#00ff88" opacity="0.4"/>
  <rect x="370" y="68" width="6" height="6" fill="#ffd700" opacity="0.5"/>
  <rect x="390" y="55" width="4" height="4" fill="#ffffff" opacity="0.6"/>
  <rect x="300" y="120" width="6" height="6" fill="#ffcc00" opacity="0.5"/>
  <rect x="280" y="165" width="4" height="4" fill="#ffffff" opacity="0.4"/>
  <rect x="340" y="170" width="6" height="6" fill="#ffd700" opacity="0.6"/>
  <rect x="315" y="158" width="4" height="4" fill="#00ff88" opacity="0.5"/>
  <rect x="350" y="148" width="6" height="6" fill="#ffffff" opacity="0.7"/>
  <rect x="290" y="225" width="4" height="4" fill="#ffcc00" opacity="0.4"/>
  <rect x="335" y="265" width="6" height="6" fill="#ffffff" opacity="0.5"/>
  <rect x="370" y="245" width="4" height="4" fill="#ffd700" opacity="0.6"/>
  <rect x="318" y="215" width="6" height="6" fill="#00ff88" opacity="0.5"/>
  <rect x="275" y="255" width="4" height="4" fill="#ffffff" opacity="0.4"/>
  <rect x="380" y="215" width="6" height="6" fill="#ffcc00" opacity="0.6"/>
  <rect x="355" y="118" width="4" height="4" fill="#ffffff" opacity="0.5"/>
  <rect x="325" y="195" width="6" height="6" fill="#ffd700" opacity="0.7"/>
  <rect x="310" y="240" width="4" height="4" fill="#00ff88" opacity="0.6"/>
  <rect x="360" y="260" width="6" height="6" fill="#ffffff" opacity="0.4"/>
  <rect x="295" y="180" width="4" height="4" fill="#ffd700" opacity="0.5"/>
