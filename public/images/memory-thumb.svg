<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="記憶翻牌 thumbnail">
  <defs>
    <!-- Background pixel grid -->
    <pattern id="pxGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="1" height="16" fill="#1a2040" opacity="0.35"/>
      <rect width="16" height="1" fill="#1a2040" opacity="0.35"/>
    </pattern>
    <!-- Card back diamond pattern -->
    <pattern id="cardBack" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1e2749"/>
      <rect x="10" y="10" width="12" height="12" fill="#2a2a5a" transform="rotate(45,10,10)"/>
      <rect x="2" y="2" width="4" height="4" fill="#333366" opacity="0.3"/>
      <rect x="14" y="14" width="4" height="4" fill="#333366" opacity="0.3"/>
      <rect x="0" y="10" width="4" height="4" fill="#333366" opacity="0.2"/>
      <rect x="10" y="0" width="4" height="4" fill="#333366" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="#0f0f23"/>
  <rect width="640" height="360" fill="url(#pxGrid)"/>

  <!-- Scene border -->
  <rect x="2" y="2" width="636" height="356" rx="4" fill="none" stroke="#1a1a3e" stroke-width="2"/>

  <!-- Ambient floating pixels (background decoration) -->
  <rect x="50" y="30" width="4" height="4" fill="#ffd700" opacity="0.08"/>
  <rect x="600" y="50" width="2" height="2" fill="#ff4466" opacity="0.06"/>
  <rect x="100" y="330" width="4" height="4" fill="#00ccff" opacity="0.07"/>
  <rect x="580" y="320" width="2" height="2" fill="#ff8844" opacity="0.05"/>
  <rect x="30" y="180" width="2" height="2" fill="#ffd700" opacity="0.08"/>
  <rect x="610" y="140" width="4" height="4" fill="#00ccff" opacity="0.06"/>
  <rect x="400" y="340" width="2" height="2" fill="#ff4466" opacity="0.07"/>
  <rect x="200" y="25" width="4" height="4" fill="#ffd700" opacity="0.05"/>
  <rect x="450" y="25" width="2" height="2" fill="#ff8844" opacity="0.06"/>
  <rect x="120" y="340" width="4" height="4" fill="#00ccff" opacity="0.08"/>
  <rect x="550" y="140" width="2" height="2" fill="#ffd700" opacity="0.05"/>
  <rect x="60" y="280" width="4" height="4" fill="#ff4466" opacity="0.07"/>

  <!-- Corner pixel decorations -->
