  <text x="42" y="58" font-family="'Press Start 2P', 'Courier New', monospace" font-size="20" fill="#e0e0ff" letter-spacing="1">記憶翻牌</text>

  <!-- ===== MATCH! BADGE ===== -->
  <!-- Banner background -->
  <rect x="490" y="268" width="140" height="48" rx="4" fill="#ffcc00" opacity="0.15"/>
  <rect x="490" y="268" width="140" height="48" rx="4" fill="none" stroke="#ffcc00" stroke-width="1" opacity="0.3"/>
  <!-- MATCH! text -->
  <text x="560" y="304" font-family="'Press Start 2P', 'Courier New', monospace" font-size="24" fill="#ffcc00" stroke="#000000" stroke-width="2" transform="rotate(-15, 560, 292)" text-anchor="middle">MATCH!</text>

  <!-- Match badge sparkles -->
  <rect x="630" y="260" width="6" height="6" fill="#ffd700" opacity="0.6"/>
  <rect x="640" y="300" width="4" height="4" fill="#ffffff" opacity="0.5"/>
  <rect x="470" y="275" width="4" height="4" fill="#ffcc00" opacity="0.4"/>

  <!-- ===== CANVAS CORNER DECORATIONS ===== -->
  <g fill="#1a1a3e" opacity="0.2">
    <!-- Top-left star -->
    <rect x="8" y="8" width="4" height="4"/>
    <rect x="12" y="4" width="4" height="4"/>
    <rect x="16" y="8" width="4" height="4"/>
    <rect x="12" y="12" width="4" height="4"/>
    <!-- Top-right star -->
    <rect x="620" y="8" width="4" height="4"/>
    <rect x="624" y="4" width="4" height="4"/>
    <rect x="628" y="8" width="4" height="4"/>
    <rect x="624" y="12" width="4" height="4"/>
    <!-- Bottom-left star -->
    <rect x="8" y="340" width="4" height="4"/>
    <rect x="12" y="336" width="4" height="4"/>
    <rect x="16" y="340" width="4" height="4"/>
    <rect x="12" y="332" width="4" height="4"/>
    <!-- Bottom-right star -->
    <rect x="620" y="340" width="4" height="4"/>
    <rect x="624" y="336" width="4" height="4"/>
    <rect x="628" y="340" width="4" height="4"/>
    <rect x="624" y="332" width="4" height="4"/>
